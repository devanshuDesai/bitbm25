[package]
name = "bitbm25"
version = "0.1.0"
edition = "2021"
description = "Exact BM25 over 64-row bitmap blocks keyed by row position"
license = "MIT OR Apache-2.0"
repository = "https://github.com/devanshuDesai/bitbm25"
publish = false

[lib]
name = "bitbm25"
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1.5.5"
memmap2 = "0.9.12"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"], optional = true }
rust-stemmers = "1.2"
stop-words = { version = "0.10.1", default-features = false, features = ["nltk"] }
unicode-normalization = "0.1"
unicode-segmentation = "1.13"

[features]
python = ["dep:pyo3"]
prof = [] # keeps hot functions out of line so a sampling profiler can tell them apart

[profile.release]
lto = true
codegen-units = 1
debug = 1 # line tables, for profilers

[profile.test]
opt-level = 2 # the brute-force reference is slow unoptimised
