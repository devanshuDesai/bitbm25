[package]
name = "bitbm25"
version = "0.1.0"
edition = "2021"
description = "Exact BM25 over 64-row bitmap blocks keyed by row position"
publish = false

[lib]
name = "bitbm25"
crate-type = ["cdylib", "rlib"]

[dependencies]
crc32fast = "1.5.5"
memmap2 = "0.9.12"
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py312"], optional = true }

[features]
python = ["dep:pyo3"]

[profile.release]
lto = true
codegen-units = 1

[profile.test]
opt-level = 2 # the brute-force reference is slow unoptimised
